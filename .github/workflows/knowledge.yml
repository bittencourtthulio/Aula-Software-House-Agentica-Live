name: Knowledge audit
# Consulta manual; nunca cria tarefas, atribuições ou PRs de curadoria.
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automacao/conhecimento.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
