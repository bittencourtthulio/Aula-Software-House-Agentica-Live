name: Native agents
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, closed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Número da issue de origem
        required: true
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: native-agents-${{ github.repository }}-${{ github.event.issue.number || 'pr-reconcile' }}
  cancel-in-progress: false
jobs:
  coordenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automacao/controlador.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
